name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Dixerne.xcodeproj \
            -scheme Dixerne

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Dixerne.xcodeproj \
            -scheme Dixerne \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA (AltStore / SideStore)
        run: |
          APP="build/Build/Products/Debug-iphoneos/Dixerne.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Dixerne.ipa Payload
          ls -lh Dixerne.ipa
          unzip -l Dixerne.ipa | grep -c "Payload/Dixerne.app/"

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: Dixerne-ipa
          path: Dixerne.ipa
          retention-days: 14

      - name: Upload build products
        uses: actions/upload-artifact@v5
        with:
          name: Dixerne-app
          path: build/Build/Products/Debug-iphoneos/Dixerne.app
          retention-days: 14
