name: Dixerne
options:
  bundleIdPrefix: com.dixerne
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient
    branch: main
targets:
  Dixerne:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Dixerne
        excludes:
          - Info.plist
          - Dixerne.entitlements
    dependencies:
      - package: LocalLLMClient
        product: LocalLLMClientCore
      - package: LocalLLMClient
        product: LocalLLMClientLlama
    info:
      path: Dixerne/Info.plist
      properties:
        CFBundleDisplayName: Dixerne
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Dix utilise la caméra pour extraire du texte, 100 % hors ligne sur votre appareil.
        NSMicrophoneUsageDescription: Dix utilise le microphone pour la dictée vocale, traitée sur l'appareil.
        NSSpeechRecognitionUsageDescription: Dix transcrit votre voix sur l'appareil.
        NSPhotoLibraryUsageDescription: Dix accède à vos photos pour l'extraction de texte hors ligne.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Dixerne/Dixerne.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dixerne.app
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: Dixerne/Dixerne.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
